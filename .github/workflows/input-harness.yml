name: input-harness
on:
  push:
    # Narrowed 2026-10-29 (task-owner): only the app/entry branch triggers
    # this lane. Parallel feature branches (custom desktop) must not spend
    # 2h harness runs per push.
    # Workflow-file-only edits (spike/mobile-desktop lanes, this file) do not
    # change product code and must not fire a full x86 harness chain.
    paths-ignore:
      - '.github/workflows/spike.yml'
      - '.github/workflows/mobile-desktop.yml'
      - '.github/workflows/input-harness.yml'
      - '.github/workflows/apk-export.yml'
      - 'ci/apk-export-request.txt'
      - '.github/workflows/migration-dryrun.yml'
      - 'ci/migration-dryrun.sh'
    branches: [gnome/evidence]
  workflow_dispatch:
    inputs:
      lane:
        description: 'full = autoenter setup + native + lifecycle + export + harness + KOE; native-only = full minus GNOME autoenter setup and harness (native + lifecycle + export + KOE, unchanged from before); koe-only = ProotKillOnExitTest fixtures alone (focused KOE qualification, no 48-test rerun); virgl-only = MINIMAL setup (VirglRootfsProvisionTest: ubuntu-base + mesa runtime ONLY, NO GNOME install/launch) + VirglServerSmokeTest (host server lifecycle + hostprobe host-EGL renderer) + VirglProbeTest (guest EGL-surfaceless eglprobe renderer proof, arch-selected from the rootfs ELF header; emulator = NOT Adreno)'
        default: 'full'
        type: choice
        options: [full, native-only, koe-only, virgl-only]

jobs:
  lorie-mouse-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LANE: ${{ github.event.inputs.lane || 'full' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install NDK + bison for vendored :lorie X server
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bison
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "platforms;android-35" >/dev/null
      - name: Build guest eglprobe + host hostprobe (virgl lane only)
        if: github.event.inputs.lane == 'virgl-only'
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu binutils
          # Guest probes (run INSIDE proot against the rootfs' glibc): the
          # rootfs arch follows the device ABI (Distros.UBUNTU: amd64 on
          # the x86_64 CI emulator, arm64 on phone) - build BOTH; the test
          # selects from the provisioned rootfs' ELF header.
          gcc -O2 -Wall -o ci/virgl/eglprobe-x86_64 ci/virgl/eglprobe.c -ldl
          aarch64-linux-gnu-gcc -O2 -Wall -o ci/virgl/eglprobe-aarch64 ci/virgl/eglprobe.c -ldl
          # Host probes (run OUTSIDE proot in the app's process env,
          # Android bionic): one per app ABI (arm64-v8a + x86_64).
          NDK_TC="$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$NDK_TC/x86_64-linux-android26-clang" -O2 -o ci/virgl/hostprobe-x86_64 ci/virgl/hostprobe.c -lEGL -lGLESv2
          "$NDK_TC/aarch64-linux-android26-clang" -O2 -o ci/virgl/hostprobe-arm64 ci/virgl/hostprobe.c -lEGL -lGLESv2
          for f in ci/virgl/eglprobe-x86_64 ci/virgl/eglprobe-aarch64 ci/virgl/hostprobe-x86_64 ci/virgl/hostprobe-arm64; do
            readelf -h "$f" | grep -E "Class|Machine|Type" || { echo "READELF-FAILED $f"; exit 1; }
            readelf -l "$f" | grep -A1 INTERP | tail -1 || true
          done
          sha256sum ci/virgl/eglprobe-x86_64 ci/virgl/eglprobe-aarch64 ci/virgl/hostprobe-x86_64 ci/virgl/hostprobe-arm64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run lorie-mouse attribution harness (x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          script: |
            adb -s emulator-5554 logcat -G 16M || true
            adb -s emulator-5554 logcat -c || true
            adb -s emulator-5554 shell settings put global anr_show_background 0 || true
            if [ "$(cat ci/launcher-suppression.conf 2>/dev/null || echo on)" = "on" ]; then adb -s emulator-5554 shell pm disable-user --user 0 com.google.android.apps.nexuslauncher || true; echo "launcher suppression: ON"; else echo "launcher suppression: OFF"; fi
            mkdir -p screenshots
            ./gradlew assembleDebug assembleDebugAndroidTest 2>&1 | tee /tmp/gradle-build.log | tail -40
            adb -s emulator-5554 install -r -g app/build/outputs/apk/debug/app-debug.apk
            adb -s emulator-5554 install -r -g app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            # SETUP: cold-first-launch + auto-enter/consent path coverage.
            # The test ends with an OWNED identity teardown (test-owned
            # ordered setup/teardown). am instrument force-stops the app
            # per invocation (AOSP 14 AMS startInstrumentation, logcat
            # reason "start instr"/"finished inst"; run 41244200992
            # 21:41:00.885/21:47:53.893), so nothing tracked crosses to the
            # harness - the harness does its OWN tracked in-invocation
            # warmup (SessionReset.trackedWarmup). The cold-first-launch
            # path stays a separate open qualification blocker (run
            # 40840614400: shell maps no UI cold); coverage NOT dropped.
            date -u +"SETUP auto-enter start %H:%M:%S (lane=$LANE)"
            if [ "$LANE" = full ]; then adb -s emulator-5554 shell am instrument -w -e class dev.phonelinux.proto.UbuntuDesktopAutoEnterTest dev.phonelinux.proto.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee /tmp/instr0.log | tail -8; else echo "autoenter SKIPPED (lane=$LANE)" > /tmp/instr0.log; fi
            if [ "$LANE" = full ]; then grep -q "OK (" /tmp/instr0.log || touch /tmp/PHONELINUX_SETUP_FAILED; fi
            date -u +"SETUP auto-enter end %H:%M:%S"
            if [ -f /tmp/PHONELINUX_SETUP_FAILED ]; then echo "AUTOENTER-SETUP-FAILED - arms not run"; exit 1; fi
            # EVIDENCE-ONLY harness: asserts bootstrap facts, logs/attaches
            # all gesture-attribution outcomes. A green job means "harness
            # executed", never "gesture qualified".
            # Native-terminal discriminator FIRST, independently bounded: it has
            # never completed in any run (blocked behind the harness stall); a
            # later harness wedge must not leave it unmeasured again.
            date -u +"NATIVE-FAKEROOT start %H:%M:%S"
            if [ "$LANE" = full ] || [ "$LANE" = native-only ]; then timeout -s KILL 1500 adb -s emulator-5554 shell am instrument -w -e class dev.phonelinux.proto.NativeTerminalFakeRootTest dev.phonelinux.proto.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee /tmp/instr-native.log | tail -15 || echo "NATIVE-INSTR-TIMEOUT: outer 1500s bound hit - instrument never returned"; else echo "native SKIPPED (lane=$LANE)" > /tmp/instr-native.log; fi
            if [ "$LANE" = full ] || [ "$LANE" = native-only ]; then grep -q "OK (" /tmp/instr-native.log || touch /tmp/PHONELINUX_NATIVE_FAILED; fi
            if [ -f /tmp/PHONELINUX_NATIVE_FAILED ]; then echo "NATIVE-DIAG survivors at bound:"; adb -s emulator-5554 shell "ps -A -o PID,PPID,ARGS" | grep -E "phonelinux|proot|bash|Xlorie" || true; adb -s emulator-5554 shell am force-stop dev.phonelinux.proto || true; fi
            # GNOME session lifecycle regression (retry-implies-stop, clobber
            # window, concurrent stops): cheap (sleep-process fakes, no
            # rootfs), always on, independently bounded.
            date -u +"LIFECYCLE start %H:%M:%S"
            # Bound 300->1500 covers the real-GNOME-session fixtures in this arm (lifecycle + reentry); not a product-hang mask.
            if [ "$LANE" = full ] || [ "$LANE" = native-only ]; then timeout -s KILL 1500 adb -s emulator-5554 shell am instrument -w -e class dev.phonelinux.proto.GnomeSessionLifecycleTest,dev.phonelinux.proto.OpenDesktopReentryTest dev.phonelinux.proto.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee /tmp/instr-lifecycle.log | tail -8 || echo "LIFECYCLE-INSTR-TIMEOUT: outer 300s bound hit - instrument never returned"; else echo "lifecycle SKIPPED (lane=$LANE)" > /tmp/instr-lifecycle.log; fi
            if [ "$LANE" = full ] || [ "$LANE" = native-only ]; then grep -q "OK (" /tmp/instr-lifecycle.log || touch /tmp/PHONELINUX_LIFECYCLE_FAILED; fi
            # Bounded VirGL transport proof (dispatch-only lane). MINIMAL
            # setup: ubuntu-base + mesa runtime only - NO GNOME install or
            # launch anywhere in this lane. Stage 0 = rootfs provision;
            # stage 1 = host vtest server lifecycle + hostprobe host-EGL
            # renderer + stop/start overlap; stage 2 = guest eglprobe
            # renderer proof on EGL surfaceless (baseline arm, then opt-in
            # virpipe arm with a holding client so Stop runs with an owned
            # forked worker). glxinfo was rejected as the probe: on the
            # emulator GLX has no usable direct-rendering device, so it
            # reports the X SERVER's renderer, never the guest mesa driver
            # - and run 41307671476 lost even that output to tail -10 + a
            # discarded Proot.Result. Full reports are pulled and gated
            # below: a missing/empty report FAILS the lane, never masks.
            if [ "$LANE" = virgl-only ]; then adb -s emulator-5554 shell mkdir -p /sdcard/Android/data/dev.phonelinux.proto/files && adb -s emulator-5554 push ci/virgl/eglprobe-x86_64 ci/virgl/eglprobe-aarch64 ci/virgl/hostprobe-x86_64 ci/virgl/hostprobe-arm64 /sdcard/Android/data/dev.phonelinux.proto/files/ || { echo "VIRGL-PROBE-PUSH-FAILED - instruments NOT run"; exit 1; }; fi
            if [ "$LANE" = virgl-only ]; then timeout -s KILL 900 adb -s emulator-5554 shell am instrument -w -e class dev.phonelinux.proto.VirglRootfsProvisionTest dev.phonelinux.proto.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee /tmp/instr-virgl-provision.log | tail -20 || echo "VIRGL-PROVISION-INSTR-TIMEOUT: outer 900s bound hit - instrument never returned"; else echo "virgl-provision SKIPPED (lane=$LANE)" > /tmp/instr-virgl-provision.log; fi
            if [ "$LANE" = virgl-only ]; then grep -q "OK (" /tmp/instr-virgl-provision.log || touch /tmp/PHONELINUX_VIRGL_FAILED; fi
            if [ "$LANE" = virgl-only ] && [ ! -f /tmp/PHONELINUX_VIRGL_FAILED ]; then timeout -s KILL 900 adb -s emulator-5554 shell am instrument -w -e class dev.phonelinux.proto.VirglServerSmokeTest,dev.phonelinux.proto.VirglProbeTest dev.phonelinux.proto.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee /tmp/instr-virgl.log | tail -40 || echo "VIRGL-INSTR-TIMEOUT: outer 900s bound hit - instrument never returned"; else echo "virgl SKIPPED (lane=$LANE)" > /tmp/instr-virgl.log; fi
            if [ "$LANE" = virgl-only ]; then grep -q "OK (" /tmp/instr-virgl.log || touch /tmp/PHONELINUX_VIRGL_FAILED; fi
            if [ "$LANE" = virgl-only ]; then for f in virgl-provision.txt virgl-smoke.txt virgl-probe-default.txt virgl-probe-virpipe.txt virgl-server.log; do timeout 60 adb -s emulator-5554 exec-out run-as dev.phonelinux.proto cat files/$f > $f || echo "VIRGL-PULL-FAILED $f rc=$?"; done; fi
            # Evidence contract: every expected report must exist NON-EMPTY
            # (the tests write stub reports for unreached arms, so absence
            # means capture broke, not that the arm was skipped).
            if [ "$LANE" = virgl-only ]; then for f in virgl-provision.txt virgl-smoke.txt virgl-probe-default.txt virgl-probe-virpipe.txt; do if [ ! -s "$f" ]; then echo "VIRGL-EVIDENCE-MISSING $f"; touch /tmp/PHONELINUX_VIRGL_FAILED; fi; done; fi
            # Diagnostics export + reuse-gate health (cheap, rootfs-free,
            # gates the user-facing ZIP export). Full output printed and
            # archived - no tail-only retention for gate classes.
            date -u +"EXPORT/REUSEGATE start %H:%M:%S"
            if [ "$LANE" = full ] || [ "$LANE" = native-only ]; then timeout -s KILL 300 adb -s emulator-5554 shell am instrument -w -e class dev.phonelinux.proto.DiagnosticsExportTest,dev.phonelinux.proto.ReuseGateHealthTest,dev.phonelinux.proto.GnomeSessionScriptSafetyTest,dev.phonelinux.proto.GnomeRetryGateTest,dev.phonelinux.proto.GnomeSessionPerfConfigTest dev.phonelinux.proto.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee /tmp/instr-export.log || echo "EXPORT-INSTR-TIMEOUT: outer 300s bound hit - instrument never returned"; else echo "export SKIPPED (lane=$LANE)" > /tmp/instr-export.log; fi
            if [ "$LANE" = full ] || [ "$LANE" = native-only ]; then grep -q "OK (" /tmp/instr-export.log || touch /tmp/PHONELINUX_EXPORT_FAILED; fi
            date -u +"HARNESS arms start %H:%M:%S (lane=$LANE)"
            if [ "$LANE" = full ]; then timeout -s KILL 1500 adb -s emulator-5554 shell am instrument -w -e class dev.phonelinux.proto.LdoaInputHarnessTest dev.phonelinux.proto.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee /tmp/instr.log | tail -15 || echo "HARNESS-INSTR-TIMEOUT: outer 1500s bound hit - instrument never returned"; else echo "harness SKIPPED (lane=$LANE)" > /tmp/instr.log; fi
            if [ "$LANE" = full ]; then grep -q "OK (" /tmp/instr.log || touch /tmp/PHONELINUX_TESTS_FAILED; fi
            if [ -f /tmp/PHONELINUX_TESTS_FAILED ]; then echo "HARNESS-DIAG survivors at bound:"; adb -s emulator-5554 shell "ps -A -o PID,PPID,ARGS" | grep -E "phonelinux|proot|nautilus|Xlorie|soffice" || true; adb -s emulator-5554 exec-out run-as dev.phonelinux.proto cat files/harness-owned-ledger.txt > harness-owned-ledger.txt 2>/dev/null || echo "LEDGER-PULL-FAILED rc=$? (ledger needs the test-side spawn-ledger patch)"; adb -s emulator-5554 shell am force-stop dev.phonelinux.proto || true; fi
            # kill-on-exit + identity-reset + bus-capture fixtures (cheap:
            # toybox-symlink shaped fakes + the REAL vendored libproot.so, no
            # rootfs), always on, independently bounded. Exact count pinned:
            # the class has 13 tests; a drift fails loudly here, never
            # silently passes.
            # PLACEMENT: after the harness arms. am instrument force-stops
            # the app per invocation (AOSP 14 AMS startInstrumentation), so
            # no state crosses into the fixture class either way; running
            # last simply keeps fixture 5's untracked-world scan on a world
            # the harness already tore down by owned identity.
            date -u +"KOE-FIXTURES start %H:%M:%S"
            timeout -s KILL 300 adb -s emulator-5554 shell am instrument -w -e class dev.phonelinux.proto.ProotKillOnExitTest dev.phonelinux.proto.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee /tmp/instr-koe.log | tail -10 || echo "KOE-INSTR-TIMEOUT: outer 300s bound hit - instrument never returned"
            grep -q "OK (13 tests)" /tmp/instr-koe.log || touch /tmp/PHONELINUX_KOE_FAILED
            timeout 60 adb -s emulator-5554 exec-out run-as dev.phonelinux.proto cat files/guest-gnome.log > guest-gnome.log || echo "GNOME-LOG-PULL-FAILED rc=$?"
            timeout 60 adb -s emulator-5554 exec-out run-as dev.phonelinux.proto cat files/phantom-snapshots.log > phantom-snapshots.log || echo "PHANTOM-SNAPSHOTS-PULL-FAILED rc=$?"
            timeout 120 adb -s emulator-5554 exec-out run-as dev.phonelinux.proto cat files/phantom-dumpsys-raw.log > phantom-dumpsys-raw.log || echo "PHANTOM-RAW-PULL-FAILED rc=$?"
            timeout 60 adb -s emulator-5554 logcat -d > /tmp/shotlog.txt || true
            python3 .github/scripts/extract_shots.py /tmp/shotlog.txt screenshots || true
            python3 .github/scripts/extract_shots.py /tmp/instr.log screenshots || true
            find screenshots -type f | sort || true
            if [ -f /tmp/PHONELINUX_LIFECYCLE_FAILED ]; then echo "LIFECYCLE-FAILED-OR-TIMEOUT"; fi
            if [ -f /tmp/PHONELINUX_KOE_FAILED ]; then echo "KOE-FIXTURES-FAILED-OR-TIMEOUT"; fi
            if [ -f /tmp/PHONELINUX_NATIVE_FAILED ]; then echo "NATIVE-FAKEROOT-FAILED-OR-TIMEOUT"; fi
            if [ -f /tmp/PHONELINUX_EXPORT_FAILED ]; then echo "EXPORT-REUSEGATE-FAILED-OR-TIMEOUT"; fi
            if [ -f /tmp/PHONELINUX_TESTS_FAILED ]; then exit 1; fi
            if [ -f /tmp/PHONELINUX_LIFECYCLE_FAILED ]; then exit 1; fi
            if [ -f /tmp/PHONELINUX_KOE_FAILED ]; then exit 1; fi
            if [ -f /tmp/PHONELINUX_NATIVE_FAILED ]; then exit 1; fi
            if [ -f /tmp/PHONELINUX_EXPORT_FAILED ]; then exit 1; fi
            if [ -f /tmp/PHONELINUX_VIRGL_FAILED ]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: input-harness-evidence
          path: |
            screenshots/
            guest-gnome.log
            harness-owned-ledger.txt
            phantom-snapshots.log
            phantom-dumpsys-raw.log
            /tmp/shotlog.txt
            /tmp/instr0.log
            /tmp/instr-native.log
            /tmp/instr-lifecycle.log
            /tmp/instr-virgl.log
            /tmp/instr-virgl-provision.log
            /tmp/instr-koe.log
            /tmp/instr-export.log
            /tmp/gradle-build.log
            /tmp/instr.log
            virgl-provision.txt
            virgl-smoke.txt
            virgl-probe-default.txt
            virgl-probe-virpipe.txt
            virgl-server.log
