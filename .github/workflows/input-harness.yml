name: input-harness
on:
  push:
    # Narrowed 2026-10-29 (task-owner): only the app/entry branch triggers
    # this lane. Parallel feature branches (custom desktop) must not spend
    # 2h harness runs per push.
    # Workflow-file-only edits (spike/mobile-desktop lanes, this file) do not
    # change product code and must not fire a full x86 harness chain.
    paths-ignore:
      - '.github/workflows/spike.yml'
      - '.github/workflows/mobile-desktop.yml'
      - '.github/workflows/input-harness.yml'
      - '.github/workflows/apk-export.yml'
      - 'ci/apk-export-request.txt'
      - '.github/workflows/migration-dryrun.yml'
      - 'ci/migration-dryrun.sh'
    branches: [gnome/evidence]
  workflow_dispatch:
    inputs:
      lane:
        description: 'full = autoenter setup + native + lifecycle (incl. reentry recovery) + export + harness + virgl-session (P3 real-session qualification) + KOE; native-only = full minus GNOME autoenter setup and harness (native + lifecycle + export + KOE, unchanged from before); koe-only = ProotKillOnExitTest fixtures alone (focused KOE qualification, no 48-test rerun); virgl-only = MINIMAL setup (VirglRootfsProvisionTest: ubuntu-base + mesa runtime ONLY, NO GNOME install/launch) + VirglServerSmokeTest (host server lifecycle + hostprobe host-EGL renderer) + VirglProbeTest (guest EGL-surfaceless eglprobe renderer proof, arch-selected from the rootfs ELF header; emulator = NOT Adreno)'
        default: 'full'
        type: choice
        options: [full, native-only, koe-only, virgl-only]

jobs:
  lorie-mouse-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LANE: ${{ github.event.inputs.lane || 'full' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install NDK + bison for vendored :lorie X server
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bison
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "platforms;android-35" >/dev/null
      - name: Build guest eglprobe + host hostprobe (virgl lane only)
        if: github.event.inputs.lane == 'virgl-only'
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu binutils
          # glibc version contract: the runner MUST be noble (24.04) so the
          # x86_64 guest probe's glibc symbol versions can never exceed the
          # noble rootfs' glibc 2.39 (same for the noble cross sysroot).
          # Fail loudly if ubuntu-latest ever moves past noble.
          test "$(lsb_release -cs)" = "noble" || { echo "RUNNER-NOT-NOBLE: $(lsb_release -ds) - probe glibc contract unverified"; exit 1; }
          # Guest probes (run INSIDE proot; proot's loader reads+maps them,
          # no kernel exec of app-writable files): the rootfs arch follows
          # the device ABI (Distros.UBUNTU: amd64 on the x86_64 CI
          # emulator, arm64 on phone) - build BOTH; the test selects from
          # the provisioned rootfs' ELF header.
          gcc -O2 -Wall -o ci/virgl/eglprobe-x86_64 ci/virgl/eglprobe.c -ldl
          aarch64-linux-gnu-gcc -O2 -Wall -o ci/virgl/eglprobe-aarch64 ci/virgl/eglprobe.c -ldl
          # Host probes (run OUTSIDE proot): packaged as jniLibs
          # libhostprobe.so per app ABI (arm64-v8a + x86_64) so kernel exec
          # from nativeLibraryDir is allowed (filesDir exec is SELinux
          # W^X-denied on targetSdk 34). Written BEFORE the gradle build in
          # the emulator step so assembleDebug packages them.
          NDK_TC="$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p app/src/main/jniLibs/x86_64 app/src/main/jniLibs/arm64-v8a
          "$NDK_TC/x86_64-linux-android26-clang" -O2 -o app/src/main/jniLibs/x86_64/libhostprobe.so ci/virgl/hostprobe.c -lEGL -lGLESv2
          "$NDK_TC/aarch64-linux-android26-clang" -O2 -o app/src/main/jniLibs/arm64-v8a/libhostprobe.so ci/virgl/hostprobe.c -lEGL -lGLESv2
          for f in ci/virgl/eglprobe-x86_64 ci/virgl/eglprobe-aarch64 app/src/main/jniLibs/x86_64/libhostprobe.so app/src/main/jniLibs/arm64-v8a/libhostprobe.so; do
            readelf -h "$f" | grep -E "Class|Machine|Type" || { echo "READELF-FAILED $f"; exit 1; }
            readelf -l "$f" | grep -A1 INTERP | tail -1 || true
          done
          echo "max GLIBC symbol versions required by the guest probes (must be <= 2.39 = noble):"
          readelf -V ci/virgl/eglprobe-x86_64 | grep -o "GLIBC_[0-9.]*" | sort -Vu | tail -2
          readelf -V ci/virgl/eglprobe-aarch64 | grep -o "GLIBC_[0-9.]*" | sort -Vu | tail -2
          sha256sum ci/virgl/eglprobe-x86_64 ci/virgl/eglprobe-aarch64 app/src/main/jniLibs/x86_64/libhostprobe.so app/src/main/jniLibs/arm64-v8a/libhostprobe.so
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run lorie-mouse attribution harness (x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          script: |
            # ALL orchestration lives in ci/emulator-lane.sh: this runner
            # executes EACH PHYSICAL LINE of this block as a separate
            # `sh -c` (parseScript in android-emulator-runner v2), so
            # multi-line constructs are impossible and variables/functions/
            # traps never persist across lines (run 41331931845 lost the
            # harvest+KOE to exactly that). One line, one reviewable script.
            sh ci/emulator-lane.sh
      - name: Stop bounded logcat capture (always, pidfile)
        if: always()
        run: |
          # The emulator step cannot stop logcat itself (per-line sh -c makes
          # traps/variables no-ops), so capture is stopped here via the
          # persisted pidfile. Identity = pid + /proc/<pid> starttime + the
          # exact intended command, re-verified before EACH signal (TERM and
          # KILL, including after the wait): a dead pid can be reused by an
          # unrelated process, and a reused pid must receive NEITHER signal.
          # Bounded wait. The host-side file is written continuously by the
          # local adb client: run 41331931845's logcat-run.txt uploaded
          # complete (62,310 lines) after the emulator kill disconnected the
          # writer, so once the writer is gone the file is final. NOTE: a
          # GitHub job CANCELLATION (e.g. the 90min job timeout) can skip
          # even if:always() steps - that case leaves the runner's own
          # orphan cleanup to stop the capture (observed: run 41331931845
          # "Cleaning up orphan processes" at job end, capture complete).
          if [ -f logcat-run.pid ]; then
            p="$(awk '{print $1}' logcat-run.pid)"
            st="$(awk '{print $2}' logcat-run.pid)"
            case "$p" in ''|*[!0-9]*) p="" ;; esac
            is_ours() {
              [ -n "$p" ] && [ -d "/proc/$p" ] || return 1
              [ "$(sed 's/^.*) //' "/proc/$p/stat" 2>/dev/null | awk '{print $20}')" = "$st" ] || return 1
              tr '\0' ' ' < "/proc/$p/cmdline" | grep -q 'adb.*logcat -b main -b system -b crash'
            }
            if is_ours; then
              kill "$p" 2>/dev/null || true
              for i in 1 2 3 4 5; do is_ours || break; sleep 1; done
              if is_ours; then kill -9 "$p" 2>/dev/null || true; sleep 1; fi
            fi
          fi
          if [ -s logcat-run.txt ]; then echo "logcat-run.txt lines: $(wc -l < logcat-run.txt)"; else echo "LOGCAT-RUN-MISSING-OR-EMPTY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: input-harness-evidence
          path: |
            screenshots/
            guest-gnome.log
            harness-owned-ledger.txt
            phantom-snapshots.log
            phantom-dumpsys-raw.log
            /tmp/shotlog.txt
            /tmp/instr0.log
            /tmp/instr-native.log
            /tmp/instr-lifecycle.log
            /tmp/instr-virgl.log
            /tmp/instr-virgl-provision.log
            /tmp/instr-koe.log
            /tmp/instr-export.log
            /tmp/gradle-build.log
            /tmp/instr.log
            virgl-provision.txt
            virgl-smoke.txt
            virgl-probe-default.txt
            virgl-probe-virpipe.txt
            virgl-probe-nofork.txt
            virgl-visual-bench.txt
            virgl-visual-scratch.txt
            virgl-frame-llvmpipe.ppm
            virgl-frame-virgl.ppm
            virgl-server.log
            virgl-session.txt
            virgl-session-root.xwd
            gnome-recovery-evidence.txt
            /tmp/instr-virgl-session.log
            logcat-run.txt
