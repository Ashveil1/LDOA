name: managed-transfer-preflight-only
on:
  workflow_dispatch:
    inputs:
      execution_approved:
        type: boolean
        default: false
jobs:
  preflight:
    if: ${{ inputs.execution_approved }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Required existing APK build tool
        timeout-minutes: 5
        run: timeout -k 5 240 sudo apt-get -o Acquire::Retries=0 install -y --no-install-recommends bison
      - name: Existing app debug APK only, no delivery
        timeout-minutes: 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;29.0.14206865' 'platforms;android-35' >/dev/null
          timeout -k 30 1800 ./gradlew assembleDebug
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: One fresh installed-app preflight, no content transfer
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 4
          avd-name: managed-preflight-only
          emulator-port: 5554
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -wipe-data -noaudio -no-boot-anim
          script: |
            mkdir -m700 "$GITHUB_WORKSPACE/preflight-evidence"
            timeout -k 2 60 adb -s emulator-5554 install -g app/build/outputs/apk/debug/app-debug.apk
            timeout -k 2 180 bash ci/managed-comparison/preflight-only.sh
      - name: Fixed enum receipts only
        if: always()
        timeout-minutes: 1
        run: python3 ci/managed-comparison/preflight-receipt.py "$GITHUB_WORKSPACE/preflight-evidence/transfer-guards.txt"
