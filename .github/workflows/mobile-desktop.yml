# LOCAL proposal only; not registered or dispatched. Separate smoke outcome.
name: managed-emulator-exit-qualification
on:
  workflow_dispatch:
    inputs:
      execution_approved:
        type: boolean
        default: false
jobs:
  anchor-exit:
    if: ${{ inputs.execution_approved }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: One empty fresh API34 fixture, no application or source payload
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 15
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 4
          avd-name: managed-original
          emulator-port: 5554
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -wipe-data -noaudio -no-boot-anim
          script: timeout -k 2 8 python3 ci/managed-comparison/intercase_absence.py anchor --anchor "$RUNNER_TEMP/original-emulator-identity.json"
      - name: Read-only exit qualification after normal action cleanup
        timeout-minutes: 1
        run: timeout -k 2 45 python3 ci/managed-comparison/intercase_absence.py wait --anchor "$RUNNER_TEMP/original-emulator-identity.json"
# No setup-gradle, APK/build/source/archive, cache/artifact actions,
# secondary emulator, explicit kill, kill-server or force cleanup.
