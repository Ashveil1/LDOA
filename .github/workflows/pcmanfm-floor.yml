# PUBLIC ordinary job logs, no upload-artifact/cache/hosted evidence storage.
# Geometry child files capped in-flight; per-case occupancy gate96MiB.
# Selected log evidence transport <=24MiB raw,34MiB encoded,8500 data chunks.
# Local source/build logs may be larger but are not transported unbounded.
name: pcmanfm-floor-experiment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
      - name: Disposable runner dependencies (never patched package install)
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/pcmanfm-evidence"
          set -o pipefail
          timeout -k 10 110 sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=0 update 2>&1 | tee "$RUNNER_TEMP/pcmanfm-evidence/apt-update.log"
          timeout -k 10 110 sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=0 install -y --no-install-recommends build-essential intltool pkg-config libfm-gtk3-dev libgtk-3-dev jwm dbus-x11 xvfb xserver-xephyr x11-utils x11-xserver-utils x11-apps xdotool imagemagick file binutils 2>&1 | tee "$RUNNER_TEMP/pcmanfm-evidence/apt-install.log"
      - name: Verify source, build original and patch, same-prefix experiment
        timeout-minutes: 11
        env:
          FLOOR_EVIDENCE: ${{ runner.temp }}/pcmanfm-evidence
        run: timeout -k 10 600 bash ci/pcmanfm-floor/build-and-test.sh
      - name: Bounded ordinary-log evidence, no artifact or cache upload
        if: always()
        timeout-minutes: 2
        run: |
          # Previous step failure remains failed even when this succeeds/fails.
          timeout -k 2 90 python3 ci/pcmanfm-floor/transport.py emit --root "$RUNNER_TEMP/pcmanfm-evidence"
