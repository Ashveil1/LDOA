name: spike

on:
  # TEMP 2026-10-29: push trigger gated to manual dispatch while the focused
  # input-attribution harness (input-harness.yml) owns per-push cycles -
  # no parallel broad runs until the lorie-mouse right-click question
  # settles (task-owner instruction). Restore `push:` after that.
  workflow_dispatch:
    inputs:
      lanes:
        description: "all (default, includes guest-arm64) | fast = build + emulator-test only | guest-arm = build + guest-arm64 only"
        default: "all"
        required: false
      arm_emulator:
        description: "Opt-in repro of the known-doomed macOS arm64 AVD config (hosted macOS has no HVF: HV_UNSUPPORTED, job log 123418088373). Keep false."
        default: "false"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install NDK + bison for vendored :lorie X server
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bison
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "platforms;android-35" >/dev/null
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Unit-level sanity (lint-free compile of androidTest)
        run: ./gradlew compileDebugAndroidTestKotlin
      - uses: actions/upload-artifact@v4
        with:
          name: phonelinux-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  emulator-test:
    if: github.event.inputs.lanes != 'guest-arm'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install NDK + bison for vendored :lorie X server
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bison
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "platforms;android-35" >/dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run spike instrumentation on emulator (x86_64, ARM translation for our aarch64 proot)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # pixel_6 AVD defaults starve the launcher under test load
          # (ANR dialog storm, pixel-proven 4 runs) - give it all 4 runner cores.
          cores: 4
          script: |
            adb -s emulator-5554 logcat -G 16M || true
            adb -s emulator-5554 logcat -c || true
            # Background-app ANR dialogs (Pixel Launcher chokes under our
            # install/proot load) cover the app and flake UI tests; user
            # builds never show these. Foreground (our app) ANRs still show.
            adb -s emulator-5554 shell settings put global anr_show_background 0 || true
            # The Pixel Launcher wedges under our desktop-test CPU load and
            # then ANR-dialog-storms over the app, flaking UI tests.
            # (Observed: repeated "Application Not Responding:
            # com.google.android.apps.nexuslauncher" in logcat.) Real user
            # devices run a normal launcher, so suppression is a SHIPPING
            # CAVEAT: ci/launcher-suppression.conf gates it ("on" suppresses
            # for flake-free iteration, "off" qualifies the normal-launcher
            # shipping path).
            if [ "$(cat ci/launcher-suppression.conf 2>/dev/null || echo on)" = "on" ]; then adb -s emulator-5554 shell pm disable-user --user 0 com.google.android.apps.nexuslauncher || adb -s emulator-5554 shell am force-stop com.google.android.apps.nexuslauncher || true; echo "launcher suppression: ON (pm disable-user; force-stop proved insufficient - the launcher restarts and re-ANRs mid-lane, pixel-proven runs 8f18370/eaaf47f/1a81e3d/06654bc; fresh emulator each job so no re-enable needed)"; else echo "launcher suppression: OFF - normal Pixel launcher active (shipping-path qualification)"; fi
            # Both Ubuntu classes belong to the fresh-install GNOME job below.
            # AutoEnter requires an empty Ubuntu state and must run FIRST;
            # UbuntuBaseSpikeTest has already installed Ubuntu in the generic suite.
            # It is still gating in the dedicated job, not skipped or retried.
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=dev.phonelinux.proto.UbuntuGnomeSpikeTest,dev.phonelinux.proto.UbuntuDesktopAutoEnterTest --info 2>&1 | tee /tmp/instr.log || touch /tmp/PHONELINUX_TESTS_FAILED
            grep -q "BUILD SUCCESSFUL" /tmp/instr.log || touch /tmp/PHONELINUX_TESTS_FAILED
            # Host-driven cold-start E2E (parent directive): install the APK
            # on this RUNNING emulator, drive the real UI, am force-stop,
            # relaunch - the app-process-kill path in-process tests cannot
            # cover. Runs only when instrumentation passed.
            if [ ! -f /tmp/PHONELINUX_TESTS_FAILED ]; then python3 ci/cold_start_e2e.py emulator-5554 || touch /tmp/PHONELINUX_TESTS_FAILED; else echo "cold-start E2E skipped: instrumentation failed"; fi
            adb -s emulator-5554 logcat -d > /tmp/shotlog.txt || true
            python3 .github/scripts/extract_shots.py /tmp/shotlog.txt screenshots || true
            python3 .github/scripts/extract_shots.py /tmp/instr1.log screenshots || true
            python3 .github/scripts/extract_shots.py /tmp/instr2.log screenshots || true
            find screenshots -type f | sort || true
            if [ -f /tmp/PHONELINUX_TESTS_FAILED ]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-test-reports
          path: app/build/reports/androidTests/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-journey-screenshots
          path: |
            screenshots/
            /tmp/shotlog.txt

  # Ubuntu GNOME feasibility lane (B): installs Ubuntu Base 24.04 in the
  # guest, apt-installs the GNOME/Ubuntu-appearance set under proot -0,
  # launches gnome-session --session=ubuntu on the vendored lorie server,
  # and records guest-gnome.log + early/settled screenshots as artifacts.
  # INVESTIGATION LANE: continue-on-error while GNOME-on-lorie feasibility
  # is unproven; becomes gating only after a green real-render verdict.
  # apt-in-emulator is slow - its own job so the every-push lane stays fast.
  ubuntu-gnome-spike:
    if: github.event.inputs.lanes != 'fast' && github.event.inputs.lanes != 'guest-arm'
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install NDK + bison for vendored :lorie X server
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bison
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "platforms;android-35" >/dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run Ubuntu GNOME spike on emulator (x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # pixel_6 AVD defaults starve the launcher under test load
          # (ANR dialog storm, pixel-proven 4 runs) - give it all 4 runner cores.
          cores: 4
          script: |
            adb -s emulator-5554 logcat -G 16M || true
            adb -s emulator-5554 logcat -c || true
            adb -s emulator-5554 shell settings put global anr_show_background 0 || true
            if [ "$(cat ci/launcher-suppression.conf 2>/dev/null || echo on)" = "on" ]; then adb -s emulator-5554 shell pm disable-user --user 0 com.google.android.apps.nexuslauncher || true; echo "launcher suppression: ON"; else echo "launcher suppression: OFF"; fi
            # Manual install + am instrument, NOT connectedDebugAndroidTest:
            # AGP's connected task uninstalls the app+data after the tests,
            # which makes a true cold-start persistence proof impossible.
            # Manual install retains install+data so the host can force-stop
            # and relaunch the real app afterward.
            mkdir -p screenshots
            ./gradlew assembleDebug assembleDebugAndroidTest 2>&1 | tail -3
            adb -s emulator-5554 install -r -g app/build/outputs/apk/debug/app-debug.apk
            adb -s emulator-5554 install -r -g app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb -s emulator-5554 shell am instrument -w -e class dev.phonelinux.proto.UbuntuDesktopAutoEnterTest dev.phonelinux.proto.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee /tmp/instr1.log | tail -15
            grep -q "OK (" /tmp/instr1.log || touch /tmp/PHONELINUX_TESTS_FAILED
            adb -s emulator-5554 shell am instrument -w -e class dev.phonelinux.proto.UbuntuGnomeSpikeTest dev.phonelinux.proto.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee /tmp/instr2.log | tail -15
            grep -q "OK (" /tmp/instr2.log || touch /tmp/PHONELINUX_TESTS_FAILED
            # TRUE cold-start proof: full process kill (force-stop kills the
            # app uid incl. proot/GNOME children), fresh MainActivity launch,
            # pref-driven auto-enter must bring back a usable desktop with
            # zero taps. The first launch's log is PRESERVED (per-launch
            # isolation, never deleted): copy it aside and gate only on the
            # byte range appended after this point.
            adb -s emulator-5554 exec-out run-as dev.phonelinux.proto cat files/guest-gnome.log > guest-gnome.launch-prev.log 2>/dev/null || true
            GNOME_LOG_BASE=$(adb -s emulator-5554 shell run-as dev.phonelinux.proto wc -c files/guest-gnome.log 2>/dev/null | tr -d '\r' | awk '{print $1}')
            GNOME_LOG_BASE=${GNOME_LOG_BASE:-0}
            echo "gnome log base offset: $GNOME_LOG_BASE"
            adb -s emulator-5554 shell am force-stop dev.phonelinux.proto || true
            sleep 8
            adb -s emulator-5554 shell am start -n dev.phonelinux.proto/.MainActivity 2>&1 | tail -2
            for i in $(seq 1 90); do adb -s emulator-5554 exec-out run-as dev.phonelinux.proto cat files/guest-gnome.log 2>/dev/null | tail -c "+$((GNOME_LOG_BASE+1))" | grep -q "gnome-launch: shell registered" && echo "COLD-REENTER-SHELL-REGISTERED after ~$((i*10))s" && break; sleep 10; done
            adb -s emulator-5554 exec-out run-as dev.phonelinux.proto cat files/guest-gnome.log 2>/dev/null | tail -c "+$((GNOME_LOG_BASE+1))" | grep -m1 "gnome-launch: shell registered" || { echo "COLD-REENTER-MISSING: shell never registered on the fresh launch's bus"; touch /tmp/PHONELINUX_TESTS_FAILED; }
            # ANR evidence BEFORE any dismissal: attribute, don't hide.
            adb -s emulator-5554 shell dumpsys activity activities | grep -iE "anr|not responding" || echo "no ANR in dumpsys pre-dismiss"
            adb -s emulator-5554 exec-out screencap -p > screenshots/30a-ubuntu-coldstart-pre-dismiss.png || true
            adb -s emulator-5554 shell input keyevent KEYCODE_BACK || true
            sleep 2
            adb -s emulator-5554 exec-out screencap -p > screenshots/30b-ubuntu-coldstart-post-dismiss.png || true
            sleep 118
            adb -s emulator-5554 exec-out screencap -p > screenshots/30-ubuntu-coldstart-reenter.png || true
            adb -s emulator-5554 shell run-as dev.phonelinux.proto ls -ld files/distros/ubuntu/root/LDOA-proof-renamed || touch /tmp/PHONELINUX_TESTS_FAILED
            adb -s emulator-5554 shell run-as dev.phonelinux.proto ls -la files/ || true
            adb -s emulator-5554 exec-out run-as dev.phonelinux.proto cat files/guest-gnome.log > guest-gnome.log || echo "GNOME-LOG-PULL-FAILED rc=$?"
            wc -c guest-gnome.log || true
            adb -s emulator-5554 logcat -d > /tmp/shotlog.txt || true
            python3 .github/scripts/extract_shots.py /tmp/shotlog.txt screenshots || true
            python3 .github/scripts/extract_shots.py /tmp/instr1.log screenshots || true
            python3 .github/scripts/extract_shots.py /tmp/instr2.log screenshots || true
            find screenshots -type f | sort || true
            if [ -f /tmp/PHONELINUX_TESTS_FAILED ]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ubuntu-gnome-screenshots
          path: |
            screenshots/
            guest-gnome.log
            guest-gnome.launch-prev.log
            /tmp/shotlog.txt

  # ARM64 qualification lane: "ARM package compatibility != ARM execution".
  # Public-repo macos-14 runners are Apple Silicon, and android-emulator-
  # runner supports arm64-v8a images there: host AND guest are aarch64 with
  # no translation - our arm64-v8a proot and the aarch64 rootfs run natively.
  # No new accounts or spend (public repo minutes). Experimental lane: it
  # does not gate the ubuntu lane while it stabilizes.
  emulator-test-arm64:
    # DEFAULT OFF: hosted macos-14 runners do NOT expose Hypervisor.framework
    # (HVF error: HV_UNSUPPORTED - job log 123418088373), and an arm64 Android
    # image cannot boot without hardware acceleration; GitHub staff confirm
    # the hosted ARM64 fleet has no nested KVM either (runner-images #14062,
    # 2026-08-20). Retained as OPT-IN (arm_emulator=true) for repro or if
    # GitHub ever exposes HVF. ARM coverage now lives in the guest-arm64 job.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.arm_emulator == 'true'
    runs-on: macos-14
    needs: build
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install NDK + bison for vendored :lorie X server
        run: |
          brew install bison
          echo "/opt/homebrew/opt/bison/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "platforms;android-35" >/dev/null
      - name: Run spike instrumentation on emulator (arm64-v8a, native ARM execution)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          # pixel_6 AVD defaults starve the launcher under test load
          # (ANR dialog storm, pixel-proven 4 runs) - give it all 4 runner cores.
          cores: 4
          script: |
            adb -s emulator-5554 logcat -G 16M || true
            adb -s emulator-5554 logcat -c || true
            adb -s emulator-5554 shell settings put global anr_show_background 0 || true
            if [ "$(cat ci/launcher-suppression.conf 2>/dev/null || echo on)" = "on" ]; then adb -s emulator-5554 shell pm disable-user --user 0 com.google.android.apps.nexuslauncher || adb -s emulator-5554 shell am force-stop com.google.android.apps.nexuslauncher || true; echo "launcher suppression: ON (pm disable-user; force-stop proved insufficient - the launcher restarts and re-ANRs mid-lane, pixel-proven runs 8f18370/eaaf47f/1a81e3d/06654bc; fresh emulator each job so no re-enable needed)"; else echo "launcher suppression: OFF - normal Pixel launcher active (shipping-path qualification)"; fi
            # Both Ubuntu classes belong to the fresh-install GNOME job below.
            # AutoEnter requires an empty Ubuntu state and must run FIRST;
            # UbuntuBaseSpikeTest has already installed Ubuntu in the generic suite.
            # It is still gating in the dedicated job, not skipped or retried.
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=dev.phonelinux.proto.UbuntuGnomeSpikeTest,dev.phonelinux.proto.UbuntuDesktopAutoEnterTest --info 2>&1 | tee /tmp/instr.log || touch /tmp/PHONELINUX_TESTS_FAILED
            grep -q "BUILD SUCCESSFUL" /tmp/instr.log || touch /tmp/PHONELINUX_TESTS_FAILED
            adb -s emulator-5554 logcat -d > /tmp/shotlog.txt || true
            python3 .github/scripts/extract_shots.py /tmp/shotlog.txt screenshots || true
            find screenshots -type f | sort || true
            if [ -f /tmp/PHONELINUX_TESTS_FAILED ]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-journey-screenshots-arm64
          path: |
            screenshots/
            /tmp/shotlog.txt

  # Guest-side ARM64 lane: host AND guest are aarch64, no Android, no
  # emulator, no KVM (proot is userspace ptrace). Validates the two ARM
  # unknowns an x86_64 emulator cannot: (a) the arm64 ubuntu-base rootfs +
  # our exact GNOME package list actually install on aarch64, (b) proot
  # syscall mediation on aarch64 Linux during apt. LIMITS (do not
  # overclaim): host proot is Ubuntu's build, NOT the Termux-built proot
  # the APK ships; the kernel is Azure's, not Android/HyperOS; there is NO
  # display server here, so the session stage is error-class data only -
  # never a GNOME startup verdict. Android app layer (APK install, lorie
  # X server, input) is NOT covered by this lane.
  guest-arm64:
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.lanes == 'all' || github.event.inputs.lanes == 'guest-arm')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Runner reality check
        run: |
          uname -m
          test "$(uname -m)" = "aarch64"
          ls -l /dev/kvm 2>&1 || echo "/dev/kvm absent (expected; not needed - proot is userspace)"
      - name: Build host proot from termux/proot source
        run: |
          # Ubuntu noble's proot 5.1.0-1.3 SEGFAULTS (signal 11) running
          # apt under a noble guest on this fleet (job 123476210272) - the
          # app vendors a Termux-built proot, so the faithful host
          # approximation is the same source built for glibc. NOT bit-
          # identical to the vendored bionic build: results remain
          # guest-side ARM evidence, not Android proof.
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential git libtalloc-dev
          # Pinned source commit for reproducibility (reviewed family, fixed
          # vendor input): termux/proot b27d81a68d765f3462e807f4a14e01a03f8e89ea
          git clone https://github.com/termux/proot.git /tmp/termux-proot
          git -C /tmp/termux-proot checkout b27d81a68d765f3462e807f4a14e01a03f8e89ea
          git -C /tmp/termux-proot log -1 --format='%H %s' 
          make -C /tmp/termux-proot/src -j4
          /tmp/termux-proot/src/proot --version
      - name: Fetch the exact arm64 rootfs the app would use
        run: |
          UBUNTU_BASE=$(grep -o 'UBUNTU_BASE = "[^"]*"' app/src/main/java/dev/phonelinux/proto/DistroInstaller.kt | cut -d'"' -f2)
          UBUNTU_VER=$(grep -o 'UBUNTU_VER = "[^"]*"' app/src/main/java/dev/phonelinux/proto/DistroInstaller.kt | cut -d'"' -f2)
          echo "rootfs URL: $UBUNTU_BASE/ubuntu-base-$UBUNTU_VER-base-arm64.tar.gz"
          curl -fSL "$UBUNTU_BASE/ubuntu-base-$UBUNTU_VER-base-arm64.tar.gz" -o /tmp/rootfs.tar.gz
          mkdir -p /tmp/rootfs
          tar -xzf /tmp/rootfs.tar.gz -C /tmp/rootfs
      - name: GATE - proot + apt install of the exact GNOME package list
        run: |
          PKGS=$(sed -n '/GNOME_PACKAGES = listOf(/,/) *$/p' app/src/main/java/dev/phonelinux/proto/GuestUbuntu.kt | grep -o '"[^"]*"' | tr -d '"' | tr '\n' ' ')
          echo "package list from GuestUbuntu.kt: $PKGS"
          PROOT=/tmp/termux-proot/src/proot
          # --link2symlink restored: Termux proot supports it, matching the
          # app's Proot.runGuest flags exactly.
          run_guest() { $PROOT --link2symlink -0 -r /tmp/rootfs -b /dev -b /proc -b /sys -w /root env DEBIAN_FRONTEND=noninteractive "$@"; }
          run_guest apt-get update || run_guest apt-get update
          run_guest apt-get install -y --no-install-recommends $PKGS || run_guest apt-get install -y --no-install-recommends $PKGS
      - name: Diagnostic only - session launch attempt WITHOUT display server
        run: |
          echo "NO DISPLAY SERVER in this lane (no lorie, no Xvfb): output below is error-class data only, NOT a GNOME startup verdict. Android display/input path untested here."
          /tmp/termux-proot/src/proot --link2symlink -0 -r /tmp/rootfs -b /dev -b /proc -b /sys -w /root dbus-launch gnome-session --session=ubuntu 2>&1 | head -50 || true
