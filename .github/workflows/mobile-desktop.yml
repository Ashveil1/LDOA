# LOCAL split-fresh-host comparison proposal, no execution authority.
name: managed-split-fresh-host-comparison
on:
  workflow_dispatch:
    inputs:
      execution_approved:
        type: boolean
        default: false
jobs:
  repro_first:
    if: ${{ inputs.execution_approved }}
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    outputs:
      contract: ${{ steps.receipt.outputs.contract }}
      inputs: ${{ steps.receipt.outputs.inputs }}
      outputs: ${{ steps.receipt.outputs.outputs }}
      repository: ${{ steps.receipt.outputs.repository }}
      run_id: ${{ steps.receipt.outputs.run_id }}
      run_attempt: ${{ steps.receipt.outputs.run_attempt }}
      sha: ${{ steps.receipt.outputs.sha }}
      job: ${{ steps.receipt.outputs.job }}
      role: ${{ steps.receipt.outputs.role }}
    steps:
      - name: Private build location and bounded KVM setup
        timeout-minutes: 1
        run: |
          printf 'FLOOR_EVIDENCE=%s/managed-private\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -m700 "$RUNNER_TEMP/managed-private"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/checkout@v4
        timeout-minutes: 4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        timeout-minutes: 1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        timeout-minutes: 1
        with:
          cache-disabled: true
      - name: Same controlled host build dependencies
        timeout-minutes: 8
        run: |
          timeout -k 5 120 sudo apt-get -o Acquire::Retries=0 update
          timeout -k 10 300 sudo apt-get -o Acquire::Retries=0 install -y --no-install-recommends build-essential intltool pkg-config libfm-gtk3-dev libgtk-3-dev bison
      - name: Both source variants and SDK only
        timeout-minutes: 15
        run: bash ci/managed-comparison/paired_repro_build.sh first
      - name: Existing private pinned signing and app-test certificate binding
        timeout-minutes: 32
        env:
          LDOA_DEBUG_KEYSTORE_B64: ${{ secrets.LDOA_DEBUG_KEYSTORE_B64 }}
        run: timeout -k 10 1850 python3 ci/managed-comparison/pinned_repro_signing.py
      - name: Finite v2 declared identity receipt
        timeout-minutes: 2
        id: receipt
        run: timeout -k 2 90 python3 ci/managed-comparison/independent_observations.py --role first --private "$FLOOR_EVIDENCE"
      - name: original one fresh API34 emulator on separate hosted runner
        timeout-minutes: 63
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 4
          avd-name: managed-original
          emulator-port: 5554
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -wipe-data -noaudio -no-boot-anim
          script: timeout -k 2 5 python3 ci/managed-comparison/runtime_sdk.py original && MANAGED_CASE_EXEC_APPROVED=yes bash ci/managed-comparison/run-case.sh original "$FLOOR_EVIDENCE/incoming-original" "$(cat "$FLOOR_EVIDENCE/pin-original")"
      - name: Exact original-only bounded evidence, no source payload
        if: always()
        timeout-minutes: 2
        run: timeout -k 2 90 python3 ci/managed-comparison/transport.py emit --expected-case original --evidence "$GITHUB_WORKSPACE/comparison-evidence" --private "$FLOOR_EVIDENCE"
  repro_second:
    needs: repro_first
    if: ${{ inputs.execution_approved && needs.repro_first.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    outputs:
      contract: ${{ steps.receipt.outputs.contract }}
      inputs: ${{ steps.receipt.outputs.inputs }}
      outputs: ${{ steps.receipt.outputs.outputs }}
      repository: ${{ steps.receipt.outputs.repository }}
      run_id: ${{ steps.receipt.outputs.run_id }}
      run_attempt: ${{ steps.receipt.outputs.run_attempt }}
      sha: ${{ steps.receipt.outputs.sha }}
      job: ${{ steps.receipt.outputs.job }}
      role: ${{ steps.receipt.outputs.role }}
    steps:
      - name: Private build location and bounded KVM setup
        timeout-minutes: 1
        run: |
          printf 'FLOOR_EVIDENCE=%s/managed-private\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -m700 "$RUNNER_TEMP/managed-private"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/checkout@v4
        timeout-minutes: 4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        timeout-minutes: 1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        timeout-minutes: 1
        with:
          cache-disabled: true
      - name: Same controlled host build dependencies
        timeout-minutes: 8
        run: |
          timeout -k 5 120 sudo apt-get -o Acquire::Retries=0 update
          timeout -k 10 300 sudo apt-get -o Acquire::Retries=0 install -y --no-install-recommends build-essential intltool pkg-config libfm-gtk3-dev libgtk-3-dev bison
      - name: Both source variants and SDK only
        timeout-minutes: 15
        run: bash ci/managed-comparison/paired_repro_build.sh second
      - name: Existing private pinned signing and app-test certificate binding
        timeout-minutes: 32
        env:
          LDOA_DEBUG_KEYSTORE_B64: ${{ secrets.LDOA_DEBUG_KEYSTORE_B64 }}
        run: timeout -k 10 1850 python3 ci/managed-comparison/pinned_repro_signing.py
      - name: Finite v2 declared identity and explicit independent-host limits
        timeout-minutes: 2
        id: receipt
        env:
          FIRST_CONTRACT: ${{ needs.repro_first.outputs.contract }}
          FIRST_INPUTS: ${{ needs.repro_first.outputs.inputs }}
          FIRST_OUTPUTS: ${{ needs.repro_first.outputs.outputs }}
          FIRST_REPOSITORY: ${{ needs.repro_first.outputs.repository }}
          FIRST_RUN_ID: ${{ needs.repro_first.outputs.run_id }}
          FIRST_RUN_ATTEMPT: ${{ needs.repro_first.outputs.run_attempt }}
          FIRST_SHA: ${{ needs.repro_first.outputs.sha }}
          FIRST_JOB: ${{ needs.repro_first.outputs.job }}
          FIRST_ROLE: ${{ needs.repro_first.outputs.role }}
        run: timeout -k 2 90 python3 ci/managed-comparison/independent_observations.py --role second --private "$FLOOR_EVIDENCE"
      - name: patched one fresh API34 emulator on separate hosted runner
        timeout-minutes: 63
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 4
          avd-name: managed-patched
          emulator-port: 5554
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -wipe-data -noaudio -no-boot-anim
          script: timeout -k 2 5 python3 ci/managed-comparison/runtime_sdk.py patched && MANAGED_CASE_EXEC_APPROVED=yes bash ci/managed-comparison/run-case.sh patched "$FLOOR_EVIDENCE/incoming-patched" "$(cat "$FLOOR_EVIDENCE/pin-patched")"
      - name: Exact patched-only bounded evidence, no source payload
        if: always()
        timeout-minutes: 2
        run: timeout -k 2 90 python3 ci/managed-comparison/transport.py emit --expected-case patched --evidence "$GITHUB_WORKSPACE/comparison-evidence" --private "$FLOOR_EVIDENCE"
# No shared artifacts/cache upload/source publication/automatic fallback.
# 2x130min=260 runner-min proposed, separate approval required.
# Per job:124 timed maxima +5 setup(1 private/KVM+2 checkout+1 Java+1 Gradle)+1 overhead=130.
# Dependencies8m still contains existing timeout maxima125+310=435s, with45s step slack.
# Hard step/job limits may refuse slow setup; no retries or completion guarantee.

