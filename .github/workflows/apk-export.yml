name: apk-export
# Dispatch-only build lane: produces an installable debug APK artifact for a
# specific head WITHOUT re-running the 25-min x86 input-harness chain.
# Added 2026-10-31 when the verification push (0c7516d83) passed green but no
# workflow published an installable APK of that head.
on:
  workflow_dispatch:
  push:
    # Narrow request path: only an explicit request-file bump fires this
    # build-only lane (product pushes stay on input-harness).
    branches: [gnome/evidence]
    paths:
      - 'ci/apk-export-request.txt'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install NDK + bison for vendored :lorie X server
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bison
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "platforms;android-35" >/dev/null
      - name: Decode pinned debug keystore when the repo secret exists
        env:
          LDOA_DEBUG_KEYSTORE_B64: ${{ secrets.LDOA_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$LDOA_DEBUG_KEYSTORE_B64" ]; then
            umask 077
            printf '%s' "$LDOA_DEBUG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ldoa-debug.keystore"
            keytool -list -keystore "$RUNNER_TEMP/ldoa-debug.keystore" -storepass android -alias androiddebugkey >/dev/null
            echo "LDOA_KS_ARGS=-Pldoa.keystore.path=$RUNNER_TEMP/ldoa-debug.keystore -Pldoa.keystore.password=android -Pldoa.key.alias=androiddebugkey -Pldoa.key.password=android" >> "$GITHUB_ENV"
            echo "pinned signing: ACTIVE (keystore decoded from repo secret)"
          else
            echo "LDOA_KS_ARGS=" >> "$GITHUB_ENV"
            echo "pinned signing: ABSENT (ephemeral per-run debug key)"
          fi
      - name: Build debug APK
        run: ./gradlew assembleDebug $LDOA_KS_ARGS
      - name: Record APK identity
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER="$(ls "$ANDROID_HOME/build-tools/"*/apksigner 2>/dev/null | sort -V | tail -1)"; [ -n "$APKSIGNER" ] && "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk || echo "apksigner unavailable"
      - uses: actions/upload-artifact@v4
        with:
          name: phonelinux-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
