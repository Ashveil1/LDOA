name: spike

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install NDK + bison for vendored :lorie X server
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bison
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "platforms;android-35" >/dev/null
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Unit-level sanity (lint-free compile of androidTest)
        run: ./gradlew compileDebugAndroidTestKotlin
      - uses: actions/upload-artifact@v4
        with:
          name: phonelinux-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  emulator-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install NDK + bison for vendored :lorie X server
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bison
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "platforms;android-35" >/dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run spike instrumentation on emulator (x86_64, ARM translation for our aarch64 proot)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            ./gradlew connectedDebugAndroidTest --info 2>&1 | tee /tmp/instr.log || touch /tmp/PHONELINUX_TESTS_FAILED
            grep -q "BUILD SUCCESSFUL" /tmp/instr.log || touch /tmp/PHONELINUX_TESTS_FAILED
            mkdir -p screenshots
            python3 .github/scripts/extract_shots.py /tmp/instr.log screenshots || true
            find screenshots -type f | sort || true
            if [ -f /tmp/PHONELINUX_TESTS_FAILED ]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-test-reports
          path: app/build/reports/androidTests/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-journey-screenshots
          path: screenshots/
