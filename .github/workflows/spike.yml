name: spike

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install NDK + bison for vendored :lorie X server
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bison
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "platforms;android-35" >/dev/null
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Unit-level sanity (lint-free compile of androidTest)
        run: ./gradlew compileDebugAndroidTestKotlin
      - uses: actions/upload-artifact@v4
        with:
          name: phonelinux-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  emulator-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install NDK + bison for vendored :lorie X server
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bison
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "platforms;android-35" >/dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run spike instrumentation on emulator (x86_64, ARM translation for our aarch64 proot)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb -s emulator-5554 logcat -G 16M || true
            adb -s emulator-5554 logcat -c || true
            # Background-app ANR dialogs (Pixel Launcher chokes under our
            # install/proot load) cover the app and flake UI tests; user
            # builds never show these. Foreground (our app) ANRs still show.
            adb -s emulator-5554 shell settings put global anr_show_background 0 || true
            # The Pixel Launcher wedges under our desktop-test CPU load and
            # then ANR-dialog-storms over the app, flaking UI tests.
            # (Observed: repeated "Application Not Responding:
            # com.google.android.apps.nexuslauncher" in logcat.) Real user
            # devices run a normal launcher, so suppression is a SHIPPING
            # CAVEAT: ci/launcher-suppression.conf gates it ("on" suppresses
            # for flake-free iteration, "off" qualifies the normal-launcher
            # shipping path).
            if [ "$(cat ci/launcher-suppression.conf 2>/dev/null || echo on)" = "on" ]; then adb -s emulator-5554 shell am force-stop com.google.android.apps.nexuslauncher || true; echo "launcher suppression: ON (emulator flake workaround)"; else echo "launcher suppression: OFF - normal Pixel launcher active (shipping-path qualification)"; fi
            # notClass: UbuntuGnomeSpikeTest provisions full GNOME over apt
            # (tens of minutes); it runs only in the ubuntu-gnome-spike job.
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=dev.phonelinux.proto.UbuntuGnomeSpikeTest --info 2>&1 | tee /tmp/instr.log || touch /tmp/PHONELINUX_TESTS_FAILED
            grep -q "BUILD SUCCESSFUL" /tmp/instr.log || touch /tmp/PHONELINUX_TESTS_FAILED
            # Host-driven cold-start E2E (parent directive): install the APK
            # on this RUNNING emulator, drive the real UI, am force-stop,
            # relaunch - the app-process-kill path in-process tests cannot
            # cover. Runs only when instrumentation passed.
            if [ ! -f /tmp/PHONELINUX_TESTS_FAILED ]; then python3 ci/cold_start_e2e.py emulator-5554 || touch /tmp/PHONELINUX_TESTS_FAILED; else echo "cold-start E2E skipped: instrumentation failed"; fi
            adb -s emulator-5554 logcat -d > /tmp/shotlog.txt || true
            mkdir -p screenshots
            python3 .github/scripts/extract_shots.py /tmp/shotlog.txt screenshots || true
            python3 .github/scripts/extract_shots.py /tmp/instr.log screenshots || true
            find screenshots -type f | sort || true
            if [ -f /tmp/PHONELINUX_TESTS_FAILED ]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-test-reports
          path: app/build/reports/androidTests/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-journey-screenshots
          path: |
            screenshots/
            /tmp/shotlog.txt

  # Ubuntu GNOME feasibility lane (B): installs Ubuntu Base 24.04 in the
  # guest, apt-installs the GNOME/Ubuntu-appearance set under proot -0,
  # launches gnome-session --session=ubuntu on the vendored lorie server,
  # and records guest-gnome.log + early/settled screenshots as artifacts.
  # INVESTIGATION LANE: continue-on-error while GNOME-on-lorie feasibility
  # is unproven; becomes gating only after a green real-render verdict.
  # apt-in-emulator is slow - its own job so the every-push lane stays fast.
  ubuntu-gnome-spike:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install NDK + bison for vendored :lorie X server
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bison
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "platforms;android-35" >/dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run Ubuntu GNOME spike on emulator (x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb -s emulator-5554 logcat -G 16M || true
            adb -s emulator-5554 logcat -c || true
            adb -s emulator-5554 shell settings put global anr_show_background 0 || true
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.phonelinux.proto.UbuntuGnomeSpikeTest --info 2>&1 | tee /tmp/instr.log || touch /tmp/PHONELINUX_TESTS_FAILED
            grep -q "BUILD SUCCESSFUL" /tmp/instr.log || touch /tmp/PHONELINUX_TESTS_FAILED
            adb -s emulator-5554 shell run-as dev.phonelinux.proto cat files/guest-gnome.log > guest-gnome.log 2>/dev/null || true
            adb -s emulator-5554 logcat -d > /tmp/shotlog.txt || true
            mkdir -p screenshots
            python3 .github/scripts/extract_shots.py /tmp/shotlog.txt screenshots || true
            python3 .github/scripts/extract_shots.py /tmp/instr.log screenshots || true
            find screenshots -type f | sort || true
            if [ -f /tmp/PHONELINUX_TESTS_FAILED ]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ubuntu-gnome-screenshots
          path: |
            screenshots/
            guest-gnome.log
            /tmp/shotlog.txt

  # ARM64 qualification lane: "ARM package compatibility != ARM execution".
  # Public-repo macos-14 runners are Apple Silicon, and android-emulator-
  # runner supports arm64-v8a images there: host AND guest are aarch64 with
  # no translation - our arm64-v8a proot and the aarch64 rootfs run natively.
  # No new accounts or spend (public repo minutes). Experimental lane: it
  # does not gate the ubuntu lane while it stabilizes.
  emulator-test-arm64:
    # GATED to manual dispatch: hosted macos-14 runners do NOT expose
    # Hypervisor.framework (HVF error: HV_UNSUPPORTED, run 772fadb), and an
    # arm64 Android image cannot boot without hardware acceleration. Kept
    # for reproduction; not a per-push lane until ARM-capable runners exist.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    needs: build
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install NDK + bison for vendored :lorie X server
        run: |
          brew install bison
          echo "/opt/homebrew/opt/bison/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "platforms;android-35" >/dev/null
      - name: Run spike instrumentation on emulator (arm64-v8a, native ARM execution)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          script: |
            adb -s emulator-5554 logcat -G 16M || true
            adb -s emulator-5554 logcat -c || true
            adb -s emulator-5554 shell settings put global anr_show_background 0 || true
            if [ "$(cat ci/launcher-suppression.conf 2>/dev/null || echo on)" = "on" ]; then adb -s emulator-5554 shell am force-stop com.google.android.apps.nexuslauncher || true; echo "launcher suppression: ON (emulator flake workaround)"; else echo "launcher suppression: OFF - normal Pixel launcher active (shipping-path qualification)"; fi
            # notClass: UbuntuGnomeSpikeTest provisions full GNOME over apt
            # (tens of minutes); it runs only in the ubuntu-gnome-spike job.
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=dev.phonelinux.proto.UbuntuGnomeSpikeTest --info 2>&1 | tee /tmp/instr.log || touch /tmp/PHONELINUX_TESTS_FAILED
            grep -q "BUILD SUCCESSFUL" /tmp/instr.log || touch /tmp/PHONELINUX_TESTS_FAILED
            adb -s emulator-5554 logcat -d > /tmp/shotlog.txt || true
            mkdir -p screenshots
            python3 .github/scripts/extract_shots.py /tmp/shotlog.txt screenshots || true
            find screenshots -type f | sort || true
            if [ -f /tmp/PHONELINUX_TESTS_FAILED ]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-journey-screenshots-arm64
          path: |
            screenshots/
            /tmp/shotlog.txt
