name: mobile-desktop

# DISPATCH-ONLY investigation lane for the additive LDOA mobile desktop
# mode (Phase A, user-approved 2026-10-29). Never runs on push: per-push
# cycles belong to the sibling-owned lanes. Distinct artifact names. A
# green job means the mobile session launched/rendered/tore down in the
# x86_64 emulator - never ARM or device qualification.
on:
  workflow_dispatch:

jobs:
  mobile-shell-spike:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install NDK + bison for vendored :lorie X server
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bison
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "platforms;android-35" >/dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run mobile desktop spike on emulator (x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          script: |
            adb -s emulator-5554 logcat -G 16M || true
            adb -s emulator-5554 logcat -c || true
            adb -s emulator-5554 shell settings put global anr_show_background 0 || true
            if [ "$(cat ci/launcher-suppression.conf 2>/dev/null || echo on)" = "on" ]; then adb -s emulator-5554 shell pm disable-user --user 0 com.google.android.apps.nexuslauncher || true; echo "launcher suppression: ON"; else echo "launcher suppression: OFF"; fi
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.phonelinux.proto.MobileShellSpikeTest --info 2>&1 | tee /tmp/instr.log || touch /tmp/PHONELINUX_TESTS_FAILED
            grep -q "BUILD SUCCESSFUL" /tmp/instr.log || touch /tmp/PHONELINUX_TESTS_FAILED
            adb -s emulator-5554 exec-out run-as dev.phonelinux.proto cat files/mobile-desktop.log > mobile-desktop.log || echo "MOBILE-LOG-PULL-FAILED rc=$?"
            adb -s emulator-5554 exec-out run-as dev.phonelinux.proto cat files/xserver.log > xserver.log || echo "XSERVER-LOG-PULL-FAILED rc=$?"
            ls -la mobile-desktop.log xserver.log || true
            adb -s emulator-5554 logcat -d > /tmp/shotlog.txt || true
            mkdir -p screenshots
            python3 .github/scripts/extract_shots.py /tmp/shotlog.txt screenshots || true
            python3 .github/scripts/extract_shots.py /tmp/instr.log screenshots || true
            find screenshots -type f | sort || true
            if [ -f /tmp/PHONELINUX_TESTS_FAILED ]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-desktop-evidence
          path: |
            screenshots/
            mobile-desktop.log
            xserver.log
            /tmp/shotlog.txt
